<meta name="theme-color" content="#0B1120">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #0B1120; }
  body {
    background: radial-gradient(ellipse at 20% 0%, #16213E 0%, #0B1120 55%), #0B1120;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #F1F5F9;
    min-height: 100vh;
    padding-bottom: 64px;
  }
  ::selection { background: #E8B95B55; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  .hero { padding: 40px 20px 8px; }
  .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: #8B98B8; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(28px, 7vw, 40px); margin: 4px 0 20px; letter-spacing: -0.01em; }

  .sky {
    position: relative; height: 90px; border-radius: 14px;
    background: linear-gradient(180deg, #0F1830 0%, #0B1120 100%);
    border: 1px solid #1E2A47; overflow: hidden; margin-bottom: 18px;
  }
  .sky-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #5D6B8C; font-size: 13px; font-style: italic; font-family: 'Fraunces', Georgia, serif; text-align: center; padding: 0 20px;
  }
  .dot { position: absolute; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .progress-track { flex: 1; height: 4px; background: #1E2A47; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #E8B95B, #FDE68A); transition: width .4s ease; }
  .progress-label { font-size: 12.5px; color: #8B98B8; white-space: nowrap; }

  .card { background: #141E33; border: 1px solid #212F52; border-radius: 16px; padding: 18px 20px; margin-bottom: 24px; }
  .pred-card { position: relative; background: linear-gradient(135deg, #1B2747 0%, #141E33 100%); border: 1px solid #2A3A63; overflow: hidden; }
  .pred-glow { position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #E8B95B22 0%, transparent 70%); }
  .pred-eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #8B98B8; }
  .pred-text { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; font-size: 17px; line-height: 1.5; max-width: 560px; position: relative; }

  input[type=text] {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid #2A3A63;
    padding: 6px 2px 12px; font-size: 16px; color: #F1F5F9; outline: none; margin-bottom: 14px; font-family: inherit;
  }
  input::placeholder { color: #5D6B8C; }
  .form-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-btn {
    font-size: 12.5px; padding: 5px 11px; border-radius: 999px; border: 1px solid #28345A;
    background: transparent; color: #8B98B8; transition: all .15s; cursor: pointer; font-family: inherit;
  }
  .cat-btn.active { }
  .cat-add { border-style: dashed; color: #6B7999; }
  .cat-new-input {
    background: #0B1120; border: 1px solid #E8B95B; border-radius: 999px; padding: 5px 11px;
    font-size: 12.5px; color: #F1F5F9; outline: none; width: 110px; font-family: inherit;
  }
  .cat-new-input::placeholder { color: #5D6B8C; }
  .stars-input { display: flex; gap: 2px; margin-left: auto; }
  .star-btn { background: none; border: none; padding: 3px; cursor: pointer; }
  .add-btn {
    display: flex; align-items: center; gap: 6px; background: #28345A; color: #5D6B8C; border: none;
    border-radius: 10px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; transition: all .15s; cursor: pointer; font-family: inherit;
  }
  .add-btn.ready { background: #E8B95B; color: #0B1120; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab-btn { font-size: 13px; padding: 6px 13px; border-radius: 8px; border: none; background: transparent; color: #6B7999; cursor: pointer; font-family: inherit; text-transform: capitalize; }
  .tab-btn.active { background: #212F52; color: #F1F5F9; font-weight: 600; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .empty-msg { color: #5D6B8C; font-size: 13.5px; padding: 20px 4px; font-style: italic; }

  .wish { display: flex; align-items: center; gap: 12px; background: #141E33; border: 1px solid #212F52; border-radius: 12px; padding: 12px 14px; animation: rise .3s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .wish.done { opacity: .6; }
  .toggle-btn { background: none; border: none; padding: 2px; flex-shrink: 0; cursor: pointer; display: flex; }
  .wish-text { flex: 1; font-size: 14.5px; }
  .wish-text.done { text-decoration: line-through; color: #7C8AA5; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .mini-stars { display: flex; flex-shrink: 0; }
  .del-btn { background: none; border: none; padding: 2px; flex-shrink: 0; cursor: pointer; display: flex; }

  svg { display: block; }
</style>
</head>
<body>
  <div class="hero wrap">
    <div class="eyebrow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#E8B95B"><path d="M12 2l1.9 6.3L20 10l-6.1 1.7L12 18l-1.9-6.3L4 10l6.1-1.7z"/></svg>
      нічне небо бажань
    </div>
    <h1>Трекер бажань</h1>

    <div class="sky" id="sky"></div>

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label" id="progressLabel">0 із 0 здійснено</div>
    </div>
  </div>

  <div class="wrap">
    <div class="card pred-card">
      <div class="pred-glow"></div>
      <div class="pred-eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#E8B95B"><path d="M12 2l1.9 6.3L20 10l-6.1 1.7L12 18l-1.9-6.3L4 10l6.1-1.7z"/></svg>
        передбачення дня · <span id="dateLabel"></span>
      </div>
      <p class="pred-text" id="predictionText"></p>
    </div>

    <div class="card">
      <input type="text" id="wishInput" placeholder="Загадайте бажання…" maxlength="200">
      <div class="form-row">
        <div class="cats" id="catButtons"></div>
        <div class="stars-input" id="priorityStars"></div>
        <button class="add-btn" id="addBtn">+ Додати</button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </div>

<script>
(function(){
  const DEFAULT_CATEGORIES = [
    { id: "подорожі", label: "Подорожі", color: "#7DD3C0" },
    { id: "речі", label: "Речі", color: "#E8B95B" },
    { id: "навчання", label: "Навчання", color: "#A78BFA" },
    { id: "стосунки", label: "Стосунки", color: "#F0A8B8" },
    { id: "кар'єра", label: "Кар'єра", color: "#8EB4E3" },
    { id: "інше", label: "Інше", color: "#9CA8C2" },
  ];
  const NEW_CATEGORY_COLORS = ["#E39A8E","#8ED3A6","#D3A6E3","#E3CB6C","#7FB8D9","#C98EE3","#E3856C","#9FE0C6"];

  function colorForNewCategory(existingCount){
    return NEW_CATEGORY_COLORS[existingCount % NEW_CATEGORY_COLORS.length];
  }
  function getCat(categoriesList, id){
    return categoriesList.find(c => c.id === id) || categoriesList.find(c => c.id === 'інше') || categoriesList[0];
  }

  const PREDICTIONS = [
    "Сьогодні варто озвучити бажання вголос — воно швидше знайде дорогу.",
    "Одна дрібна дія сьогодні наблизить велике бажання більше, ніж здається.",
    "День сприяє тому, щоб дозволити собі хотіти більшого.",
    "Те, що відкладали через сумнів, сьогодні варто хоча б записати.",
    "Несподівана розмова може підказати, як здійснити давнє бажання.",
    "Сьогодні гарний день, щоб оновити список — щось у ньому вже не ваше.",
    "Терпіння до одного з бажань сьогодні винагородиться раніше, ніж очікуєте.",
    "Звертайте увагу на дрібні збіги — сьогодні вони не випадкові.",
    "Бажання, яке лякає своєю масштабністю, варто розбити на перший крок уже сьогодні.",
    "День для того, щоб подякувати собі за вже здійснене.",
    "Сьогодні краще діяти, ніж чекати ідеального моменту.",
    "Хтось поруч може стати союзником для одного з ваших бажань — спитайте.",
    "Позбудьтесь одного зайвого клопоту — і в списку бажань з'явиться місце.",
    "Сьогодні варто перечитати найдавніше бажання зі списку — воно ще актуальне?",
    "День приносить ясність щодо того, чого ви хочете насправді.",
    "Маленький ризик сьогодні відкриє шлях до більшого бажання.",
    "Сьогодні варто мріяти конкретніше — деталі притягують здійснення.",
    "Те, що ви відклали «на потім», сьогодні просить хоча б п'ять хвилин уваги.",
    "День, коли варто повірити, що бажання вже в дорозі.",
    "Сьогодні приємна новина може стосуватися саме того, чого ви прагнете.",
    "Спробуйте сьогодні уявити бажання здійсненим — у деталях, наче спогад.",
    "День для чесності з собою: яке бажання у списку насправді не ваше?",
    "Сьогодні варто зробити крок, навіть маленький, у бік найважчого бажання.",
    "Той, хто питає — отримує. Сьогодні гарний день попросити про допомогу.",
    "Бажання, що повторюється у думках останнім часом, сьогодні варто записати.",
    "День сприяє завершенню — щось із давно розпочатого проситься до фіналу.",
    "Сьогодні звертайте увагу на те, що вас надихає без причини — це підказка.",
    "Одне бажання сьогодні здійсниться легше, ніж ви припускаєте.",
    "День для того, щоб додати нове бажання — без сумнівів, чи варте воно уваги.",
    "Сьогодні хороший момент відсвяткувати навіть маленький крок уперед.",
  ];

  function dayKey(d){ return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
  function predictionForDate(d){
    const key = dayKey(d);
    let h = 0;
    for (let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) >>> 0;
    return PREDICTIONS[h % PREDICTIONS.length];
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function scatter(id,i,total){
    let h=0;
    for(let k=0;k<id.length;k++) h=(h*31+id.charCodeAt(k))>>>0;
    const x=((i+0.5)/Math.max(total,1))*100;
    const y=20+(h%60);
    const delay=(h%400)/100;
    return {x,y,delay};
  }

  function starSVG(size, filled, color){
    const fillAttr = filled ? color : 'none';
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="'+fillAttr+'" stroke="'+color+'" stroke-width="1.5"><path d="M12 2l2.9 6.3 6.9.9-5 4.8 1.3 6.8L12 17.6 5.9 20.8l1.3-6.8-5-4.8 6.9-.9z"/></svg>';
  }

  // ---- state ----
  let wishes = [];
  let categories = DEFAULT_CATEGORIES.map(c => ({...c}));
  try {
    const saved = localStorage.getItem('wish-tracker-data');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) {
        // old format: just a wishes array
        wishes = parsed;
      } else if (parsed && typeof parsed === 'object') {
        wishes = Array.isArray(parsed.wishes) ? parsed.wishes : [];
        if (Array.isArray(parsed.categories) && parsed.categories.length) categories = parsed.categories;
      }
    }
  } catch(e) {}

  let category = categories[0].id;
  let priority = 2;
  let filter = 'активні';
  let addingCategory = false;

  function save(){
    try { localStorage.setItem('wish-tracker-data', JSON.stringify({ wishes, categories })); } catch(e) {}
  }

  function addCategory(rawName){
    const name = rawName.trim();
    if (!name) return null;
    const existing = categories.find(c => c.label.toLowerCase() === name.toLowerCase());
    if (existing) return existing.id;
    const id = name.toLowerCase() + '-' + uid().slice(0,4);
    const newCat = { id, label: name, color: colorForNewCategory(categories.length) };
    categories = [...categories, newCat];
    save();
    return id;
  }

  function addWish(){
    const input = document.getElementById('wishInput');
    const t = input.value.trim();
    if (!t) return;
    wishes.unshift({ id: uid(), text: t, category, priority, done: false, createdAt: Date.now() });
    input.value = '';
    save();
    render();
    input.focus();
  }

  function toggleDone(id){
    wishes = wishes.map(w => w.id === id ? {...w, done: !w.done} : w);
    save(); render();
  }
  function removeWish(id){
    wishes = wishes.filter(w => w.id !== id);
    save(); render();
  }

  function renderCatButtons(){
    const el = document.getElementById('catButtons');
    const chips = categories.map(c => {
      const active = c.id === category;
      const style = active
        ? 'border-color:'+c.color+';background:'+c.color+'22;color:'+c.color+';'
        : '';
      return '<button class="cat-btn" data-cat="'+c.id+'" style="'+style+'">'+escapeHtml(c.label)+'</button>';
    }).join('');

    if (addingCategory) {
      el.innerHTML = chips + '<input type="text" class="cat-new-input" id="newCatInput" placeholder="Назва вкладки…" maxlength="24">';
      const input = document.getElementById('newCatInput');
      input.focus();
      const commit = () => {
        const val = input.value.trim();
        addingCategory = false;
        if (val) {
          const id = addCategory(val);
          if (id) category = id;
        }
        renderCatButtons();
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') { addingCategory = false; renderCatButtons(); }
      });
      input.addEventListener('blur', commit);
    } else {
      el.innerHTML = chips + '<button class="cat-btn cat-add" id="catAddBtn">+ Нова</button>';
      document.getElementById('catAddBtn').addEventListener('click', () => { addingCategory = true; renderCatButtons(); });
    }

    el.querySelectorAll('.cat-btn[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => { category = btn.dataset.cat; renderCatButtons(); });
    });
  }

  function renderPriorityStars(){
    const el = document.getElementById('priorityStars');
    el.innerHTML = [1,2,3].map(p =>
      '<button class="star-btn" data-p="'+p+'">'+starSVG(17, p<=priority, p<=priority ? '#E8B95B' : '#3A4770')+'</button>'
    ).join('');
    el.querySelectorAll('.star-btn').forEach(btn => {
      btn.addEventListener('click', () => { priority = parseInt(btn.dataset.p); renderPriorityStars(); });
    });
  }

  function renderTabs(){
    const el = document.getElementById('tabs');
    const tabs = ['активні','здійснені','усі'];
    el.innerHTML = tabs.map(f =>
      '<button class="tab-btn'+(filter===f?' active':'')+'" data-f="'+f+'">'+f+'</button>'
    ).join('');
    el.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { filter = btn.dataset.f; render(); });
    });
  }

  function renderSky(){
    const sky = document.getElementById('sky');
    if (wishes.length === 0){
      sky.innerHTML = '<div class="sky-empty">поки що небо порожнє — додайте перше бажання</div>';
      return;
    }
    sky.innerHTML = wishes.map((w,i) => {
      const {x,y,delay} = scatter(w.id, i, wishes.length);
      const c = getCat(categories, w.category).color;
      const size = w.done ? 8 : 5;
      const bg = w.done ? '#FDE68A' : c;
      const glow = w.done ? '0 0 8px 2px #FDE68A99' : ('0 0 4px 1px '+c+'66');
      return '<div class="dot" title="'+w.text.replace(/"/g,'&quot;')+'" style="left:'+x+'%;top:'+y+'px;width:'+size+'px;height:'+size+'px;background:'+bg+';box-shadow:'+glow+';animation-duration:'+(2.4+delay)+'s;animation-delay:'+delay+'s;"></div>';
    }).join('');
  }

  function renderProgress(){
    const total = wishes.length;
    const doneCount = wishes.filter(w => w.done).length;
    const pct = total ? Math.round((doneCount/total)*100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = doneCount + ' із ' + total + ' здійснено';
  }

  function renderList(){
    let list = wishes;
    if (filter === 'активні') list = list.filter(w => !w.done);
    else if (filter === 'здійснені') list = list.filter(w => w.done);
    list = [...list].sort((a,b) => b.priority - a.priority || b.createdAt - a.createdAt);

    const el = document.getElementById('list');
    if (list.length === 0){
      el.innerHTML = '<div class="empty-msg">'+(filter==='здійснені' ? 'жодне бажання ще не здійснилось' : 'тут поки порожньо')+'</div>';
      return;
    }
    el.innerHTML = list.map(w => {
      const c = getCat(categories, w.category);
      const starsHtml = [1,2,3].map(p => starSVG(11, p<=w.priority, p<=w.priority ? '#E8B95B' : '#2A3559')).join('');
      return (
        '<div class="wish'+(w.done?' done':'')+'" data-id="'+w.id+'">'+
          '<button class="toggle-btn" data-action="toggle" data-id="'+w.id+'">'+starSVG(19, w.done, w.done ? '#FDE68A' : '#3A4770')+'</button>'+
          '<span class="wish-text'+(w.done?' done':'')+'">'+escapeHtml(w.text)+'</span>'+
          '<span class="tag" style="background:'+c.color+'1E;color:'+c.color+'">'+escapeHtml(c.label)+'</span>'+
          '<span class="mini-stars">'+starsHtml+'</span>'+
          '<button class="del-btn" data-action="del" data-id="'+w.id+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7999" stroke-width="1.75"><path d="M18 6L6 18M6 6l12 12"/></svg></button>'+
        '</div>'
      );
    }).join('');

    el.querySelectorAll('[data-action="toggle"]').forEach(btn => btn.addEventListener('click', () => toggleDone(btn.dataset.id)));
    el.querySelectorAll('[data-action="del"]').forEach(btn => btn.addEventListener('click', () => removeWish(btn.dataset.id)));
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderPrediction(){
    const today = new Date();
    document.getElementById('dateLabel').textContent = today.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' });
    document.getElementById('predictionText').textContent = predictionForDate(today);
  }

  function updateAddBtn(){
    const input = document.getElementById('wishInput');
    const btn = document.getElementById('addBtn');
    if (input.value.trim()) btn.classList.add('ready'); else btn.classList.remove('ready');
  }

  function render(){
    renderSky();
    renderProgress();
    renderTabs();
    renderList();
  }

  // init
  renderCatButtons();
  renderPriorityStars();
  renderPrediction();
  render();

  document.getElementById('addBtn').addEventListener('click', addWish);
  document.getElementById('wishInput').addEventListener('keydown', e => { if (e.key === 'Enter') addWish(); });
  document.getElementById('wishInput').addEventListener('input', updateAddBtn);

  // refresh prediction after midnight if page stays open
  setInterval(renderPrediction, 60000);

})();
</script>

</body>
</html>
